# Worktab feed settings. This is the only file you normally edit.
# Changes go live on the next run (or push, which triggers a run).

[ranking]
max_age_days = 7          # older items are dropped
max_items = 120           # page size
max_per_source = 8        # stops one busy source flooding the page
act_at = 7                # score needed for "Act on this"
read_at = 3               # score needed for "Worth reading"; below = "FYI"
drop_below = -5           # hide anything scoring lower than this
age_penalty_per_day = 1.0
summary_match_factor = 0.5   # keyword in summary counts half as much as in title
activity_factor = 1.5        # boost for points/comments (log scale)
activity_cap = 4

# Keyword weights. Matched in title (full weight) or summary (half).
# Negative numbers push things down. Case doesn't matter.
[keywords]
"Bricks" = 6
"Bricks Builder" = 2
"WordPress" = 3
"Gutenberg" = 2
"ACF" = 3
"Advanced Custom Fields" = 3
"WooCommerce" = 1
"CSS" = 2
"container queries" = 2
"view transitions" = 2
"Baseline" = 1.5
"accessibility" = 2
"WCAG" = 2
"Core Web Vitals" = 3
"performance" = 1
"SEO" = 1.5
"Google Search" = 2
"Figma" = 1.5
"design system" = 2
"typography" = 1
"UX" = 1
"Claude" = 2
"Anthropic" = 2
"MCP" = 2
"vulnerability" = 3
"security release" = 5
"security" = 1.5
"PHP" = 1
"crypto" = -10
"NFT" = -10
"hiring" = -4
"for hire" = -8

# Optional AI pass. Runs only when the provider's key is set as a repo
# secret (ANTHROPIC_API_KEY for anthropic). Without it, nothing changes.
[ai]
enabled = true
provider = "anthropic"
model = "claude-haiku-5-5"
max_items = 40            # only the top items are sent, titles + short summaries
weight = 1.0              # how strongly the AI score moves the rule score
about = """
Solo web developer building client sites in WordPress + Bricks Builder.
Cares about: Bricks and WordPress changes that affect builds, CSS and
layout techniques, accessibility, performance, SEO changes, UI/UX and
design systems, and AI tools for web work (Claude, MCP).
Not interested in: crypto, generic startup news, job posts.
"""

